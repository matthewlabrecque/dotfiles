# AeroSpace Configuration
# Ported from niri configuration (see ../niri/)
# Install to: ~/.aerospace.toml or ~/.config/aerospace/aerospace.toml
#
# NOTE: niri's "Mod" key is Super on Linux. On macOS, Cmd is heavily reserved
# by apps, so this port uses Alt/Option as the primary modifier (the AeroSpace
# convention). If you want a Cmd-style experience, swap `alt` for `cmd` below
# and accept the resulting shortcut collisions.

# ============================================================
# Layout  (replaces: modules/window-layout.kdl)
# ============================================================

# niri: prefers scrollable column tiling -> AeroSpace "tiles" (tree-based) is
# the closest analog. "accordion" is an alternative worth trying.
default-root-container-layout = 'tiles'

# Mouse behavior
on-focus-changed = []
mouse-follows-focus = false

# niri: gaps 8
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# NOT PORTABLE (niri -> AeroSpace):
# - focus-ring colors / borders: AeroSpace has no built-in window borders.
#   Use JankyBorders (https://github.com/FelixKratz/JankyBorders), e.g.:
#     borders active_color=0xffd4845c inactive_color=0xff1a2030 width=4 &
#   (niri colors here: active #d4845c, inactive #1a2030)
# - center-focused-column / preset-column-widths / center-column:
#   no equivalent; AeroSpace sizes windows via tree splits + 'resize'.
# - geometry-corner-radius / clip-to-geometry: macOS windows are already
#   rounded; no equivalent needed.
# - hot-corners: macOS has its own hot corners in System Settings > Desktop.
# - hotkey-overlay: niri/noctalia-specific, no equivalent.

# ============================================================
# Window rules  (replaces: modules/window-rules.kdl)
# ============================================================
# niri: window-rule { match app-id="..."; open-maximized true; }
# AeroSpace analog: on-window-detected + 'fullscreen'.
# NOTE: app-id on macOS is the bundle identifier. Find yours with:
#   aerospace list-apps | grep -i <name>
# (niri app-ids don't translate; bundle IDs below are best guesses — verify.)

[[on-window-detected]]
if.app-id = 'com.helium.Browser'   # verify actual bundle id
run = ['fullscreen']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['fullscreen']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'      # Vesktop does not exist on macOS; Discord equivalent
run = ['fullscreen']

# niri: floating rules for TUI popups (impala-nm, bluetui, wiremix) are
# Linux-specific; on macOS these would typically be matched on the terminal
# app + window title, e.g.:
# [[on-window-detected]]
# if.app-id = 'com.mitchellh.ghostty'
# if.window-title-regex-substring = 'wiremix'
# run = ['layout floating']

# ============================================================
# Keybindings  (replaces: modules/keybinds.kdl)
# ============================================================

[mode.main.binding]

# --- Workspace navigation ---
# niri: Mod+N { focus-workspace N; }
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# --- App launches ---
# niri: spawn "foot" -> macOS terminal (ghostty is in this dotfiles repo)
alt-return = 'exec-and-forget open -a "Ghostty"'
# niri: noctalia launcher -> no macOS equivalent; use Spotlight (cmd-space,
# built-in) or a third-party launcher like Raycast:
alt-d = 'exec-and-forget open -a "Raycast"'
# niri: control-center / settings panel -> System Settings
alt-s = 'exec-and-forget open -a "System Settings"'
# niri: nvim ~/zettlekasten
alt-o = 'exec-and-forget open -na "Ghostty" --args -e nvim ~/zettlekasten'
# niri: nautilus -> Finder
alt-f = 'exec-and-forget open -a "Finder"'
# niri: helium-browser
alt-b = 'exec-and-forget open -a "Helium"'
# niri: foot btop
alt-shift-t = 'exec-and-forget open -na "Ghostty" --args -e btop'
# niri: Mod+W close-window
alt-w = 'close'

# --- Navigation / focus ---
# niri: focus-column-left / focus-window-down / ... -> directional focus
alt-left  = 'focus left'
alt-down  = 'focus down'
alt-up    = 'focus up'
alt-right = 'focus right'
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
# niri: focus-workspace-down/up -> next/prev workspace
alt-pageDown = 'workspace next'
alt-pageUp   = 'workspace prev'

# --- Movement / manipulation ---
# niri: move-column-to-workspace N
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# niri: move-column-left / move-window-down / ...
alt-shift-left  = 'move left'
alt-shift-down  = 'move down'
alt-shift-up    = 'move up'
alt-shift-right = 'move right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# niri: move-workspace-down/up (reorder) -> no equivalent; closest is
# moving the focused window between workspaces
alt-shift-pageDown = 'move-node-to-workspace next'
alt-shift-pageUp   = 'move-node-to-workspace prev'
alt-shift-u = 'move-node-to-workspace prev'
alt-shift-i = 'move-node-to-workspace next'

# niri: move-column-to-monitor-*
alt-shift-ctrl-left  = 'move-node-to-monitor left'
alt-shift-ctrl-down  = 'move-node-to-monitor down'
alt-shift-ctrl-up    = 'move-node-to-monitor up'
alt-shift-ctrl-right = 'move-node-to-monitor right'
alt-shift-ctrl-h = 'move-node-to-monitor left'
alt-shift-ctrl-j = 'move-node-to-monitor down'
alt-shift-ctrl-k = 'move-node-to-monitor up'
alt-shift-ctrl-l = 'move-node-to-monitor right'

# --- Sizing / layout ---
# niri: toggle-window-floating
alt-ctrl-t = 'layout floating tiling'
# niri: maximize-column
alt-ctrl-f = 'fullscreen'
# niri: set-column-width +/-10%  ->  AeroSpace resize (pixels, 'smart' axis)
alt-ctrl-minus = 'resize smart -100'
alt-ctrl-equal = 'resize smart +100'

# niri toggle-overview -> macOS Mission Control
alt-shift-o = 'exec-and-forget open -a "Mission Control"'

# NOT PORTABLE (no AeroSpace equivalent / handled by macOS):
# - center-column / center-visible-columns / preset widths & heights
# - switch-preset-column-width / reset-window-height / expand-column
# - XF86 volume/brightness/mic keys: handled natively by macOS
# - Print/screenshot: use macOS built-in Cmd+Shift+3/4 (or Cmd+Shift+5 UI)
# - Mod+Alt+M sink mute: use a tool like SwitchAudioSource if needed

# ============================================================
# Display  (replaces: modules/display.kdl)
# ============================================================
# niri: output mode/scale/transform/position.
# NOT PORTABLE: macOS manages display arrangement via
# System Settings > Displays. AeroSpace cannot set modes or positions.
# AeroSpace CAN pin workspaces to monitors, e.g.:
#
# [workspace-to-monitor-force-assignment]
# 1 = 'main'
# 2 = 'secondary'

# ============================================================
# Input  (replaces: modules/input.kdl)
# ============================================================
# niri: xkb options (caps:escape), numlock, touchpad tap, natural-scroll.
# NOT PORTABLE: on macOS use:
# - caps:escape      -> System Settings > Keyboard > Modifier Keys,
#                       or Karabiner-Elements
# - tap to click     -> System Settings > Trackpad
# - natural scroll   -> System Settings > Trackpad/Mouse (Scroll direction)
# - numlock          -> n/a on macOS

# ============================================================
# Startup processes  (replaces: modules/startup-processes.kdl)
# ============================================================
# niri: spawn-at-startup xdg-desktop-portal, noctalia.
# NOT PORTABLE: both are Linux-specific. On macOS, launch background apps
# via System Settings > General > Login Items, and enable
# "AeroSpace" itself there (or use `aerospace` launch agent).
# AeroSpace runs as a normal app; there is no spawn-at-startup mechanism.

# ============================================================
# Screenshots  (niri config.kdl: screenshot-path)
# ============================================================
# NOT PORTABLE: macOS saves screenshots to ~/Desktop by default
# (configurable in the Screenshot app, Cmd+Shift+5 > Options).
