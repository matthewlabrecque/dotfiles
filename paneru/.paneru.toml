# Paneru uses virtual workspace rows within each native macOS Space. Numbered
# workspace bindings below therefore target Paneru's virtual workspaces.

[options]
focus_follows_mouse = false
mouse_follows_focus = false

# Paneru's scrolling strip is the native equivalent of the layout the old
# configuration approximated with AeroSpace's tree-based tiles.
preset_column_widths = [0.25, 0.5, 0.75, 1.0] 
reap_empty_workspaces = false
virtual_workspace_animations = true
insert_windows_mid_strip = true

[padding]
top = 5
bottom = 5
left = 5
right = 5

[bindings]
window_focus_west = "alt - h"
window_focus_east = "alt - l"
window_focus_north = "alt - k"
window_focus_south = "alt - j"

# Move the focused window within the current workspace.
window_swap_west = "ctrl + shift - h"
window_swap_east = "ctrl + shift - l"

# Switch directly to virtual workspaces 1-9.
window_virtualnum_1 = "ctrl - 1"
window_virtualnum_2 = "ctrl - 2"
window_virtualnum_3 = "ctrl - 3"
window_virtualnum_4 = "ctrl - 4"
window_virtualnum_5 = "ctrl - 5"
window_virtualnum_6 = "ctrl - 6"
window_virtualnum_7 = "ctrl - 7"
window_virtualnum_8 = "ctrl - 8"
window_virtualnum_9 = "ctrl - 9"

# Send the focused window to virtual workspace 1-9 without following it.
window_virtualsendnum_1 = "ctrl + shift - 1"
window_virtualsendnum_2 = "ctrl + shift - 2"
window_virtualsendnum_3 = "ctrl + shift - 3"
window_virtualsendnum_4 = "ctrl + shift - 4"
window_virtualsendnum_5 = "ctrl + shift - 5"
window_virtualsendnum_6 = "ctrl + shift - 6"
window_virtualsendnum_7 = "ctrl + shift - 7"
window_virtualsendnum_8 = "ctrl + shift - 8"
window_virtualsendnum_9 = "ctrl + shift - 9"

# Layout controls with direct Paneru equivalents.
window_manage = "ctrl + alt - t"
window_fullwidth = "ctrl + alt - f"
window_shrink = "ctrl + alt - minus"
window_grow = "ctrl + alt - equal"
window_center = "ctrl + alt - c"
window_nextdisplay = "ctrl + alt - n"
restart = "ctrl + alt - r"
